[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exorr-subdomain-monitor"
version = "1.0.0"
description = "EXORR Subdomain Monitor — continuous subdomain discovery and change tracking"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "EXORR Security", email = "exorrnull@gmail.com"}]
keywords = ["subdomain", "monitor", "recon", "security", "change-detection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []

[project.scripts]
exorr-subdomain-monitor = "exorr_subdomain_monitor.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[tool.setuptools.packages.find]
include = ["exorr_subdomain_monitor*"]
